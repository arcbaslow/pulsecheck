<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulsecheck store frame</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #fff; color: #1f1f1f; font: 14px/1.4 system-ui, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  header { height: 104px; display: flex; align-items: center; gap: 28px; padding: 0 40px; border-bottom: 1px solid #e3e5e8; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; width: 190px; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .rule { width: 1px; height: 52px; background: #e3e5e8; }
  h1 { margin: 0; font-size: 27px; font-weight: 650; letter-spacing: -.01em; }
  header p { margin: 3px 0 0; color: #5f6368; font-size: 15px; }
  nav { height: 36px; display: flex; align-items: stretch; gap: 2px; padding: 0 8px; border-bottom: 1px solid #e3e5e8; background: #fff; font-size: 12.5px; color: #474747; }
  nav span { display: flex; align-items: center; padding: 0 12px; }
  nav .on { color: #0b57d0; font-weight: 600; box-shadow: inset 0 -2px #0b57d0; margin-left: auto; }
  iframe { display: block; width: 1280px; height: 659px; border: 0; }
  .file { height: 659px; display: flex; flex-direction: column; background: #f8f9fa; }
  .file .bar { display: flex; justify-content: space-between; padding: 10px 24px; border-bottom: 1px solid #e3e5e8; background: #fff; color: #5f6368; font: 12.5px ui-monospace, "Cascadia Mono", Menlo, monospace; }
  .file .bar b { color: #1f1f1f; font-weight: 600; }
  pre { margin: 0; padding: 16px 24px; overflow: hidden; font: 12.5px/1.6 ui-monospace, "Cascadia Mono", Menlo, monospace; color: #3c4043; white-space: pre; }
  pre .h { color: #0b57d0; font-weight: 600; }
  pre .b { color: #1f1f1f; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <div class="brand"><img src="/icons/icon-48.png" alt="">Pulsecheck</div>
    <div class="rule"></div>
    <div><h1 id="title"></h1><p id="sub"></p></div>
  </header>
  <nav><span>Elements</span><span>Console</span><span>Sources</span><span>Network</span><span>Performance</span><span>Application</span><span class="on">Pulsecheck</span></nav>
  <main id="main"></main>
<script type="module">
  import { parse, toRequest, parseDataLayer } from '/parsers.js';
  import { buildSession, toMarkdown, fileBase } from '/export.js';
  import { demoSession, cart } from '/__demo/session.js';

  const shot = new URLSearchParams(location.search).get('shot') || '1';
  const notes = 'checkout with a promo code';
  const FRAMES = {
    1: ['Record one scenario', 'Walk through the flow; every hit lands on the strip and the live checks update as you go.', `step=600&notes=${encodeURIComponent(notes)}`],
    2: ['See what is wrong, and why', 'Click a check to see the hits behind it; each finding says what happened in plain words.', `step=600&notes=${encodeURIComponent(notes)}&click=${encodeURIComponent('.check[data-check="dupe"]|.row')}`],
    3: ['Save the evidence', 'The Markdown export carries the checks, inventory and full timeline, redacted before it is written.'],
  };
  const [title, sub, query] = FRAMES[shot];
  document.getElementById('title').textContent = title;
  document.getElementById('sub').textContent = sub;
  const main = document.getElementById('main');

  if (query) {
    main.innerHTML = `<iframe src="/panel.html?${query}"></iframe>`;
  } else {
    const t0 = Date.parse('2026-11-05T10:24:03Z');
    let seq = 0;
    const events = [];
    for (const item of demoSession(t0)) {
      const ts = t0 + item.dt;
      if (item.url) {
        for (const ev of parse(toRequest({ url: item.url, method: 'GET', body: '', transport: 'beacon' }))) events.push({ type: 'event', seq: ++seq, ...ev, source: 'network', ts, page: item.page });
      } else {
        const d = parseDataLayer(item.msg);
        events.push({ type: 'event', seq: ++seq, source: d.source || 'datalayer', vendor: d.source === 'consent' ? 'consent' : 'datalayer', event: d.event, params: d.params, ts, page: item.page });
      }
    }
    const s = buildSession({ startedAt: t0, page: cart, notes, userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/142.0.0.0', events, capture: { allRequests: false, dropped: 0 } });
    const md = toMarkdown(s);
    const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const lines = md.split('\n').slice(0, 40).map((l) => /^#/.test(l) ? `<span class="h">${esc(l)}</span>` : esc(l).replace(/\*\*([^*]+)\*\*/g, '<span class="b">**$1**</span>'));
    main.innerHTML = `<div class="file"><div class="bar"><b>${fileBase(s)}.md</b><span>Markdown, generated by Pulsecheck ${s.header.version}</span></div><pre>${lines.join('\n')}</pre></div>`;
  }
</script>
</body>
</html>
